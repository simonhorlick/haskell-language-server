# required for HLS to be able to typecheck and inspect the AST of the testdata
# files.
cradle:
  direct:
    arguments:
      - ArgNameClash
      - ArgParens
      - BodyParens
      - Capture
      - Class
      - ClassInstance
      - Constant
      - Cpp
      - CrossFileDef
      - CrossFileUse
      - DoBlock
      - DuplicateArg
      - FixityDef
      - FixityOther
      - FixityUse
      - Guards
      - Imported
      - InLambda
      - Infix
      - InfixExtraArg
      - Let
      - Let2
      - Let3
      - ListLiteral
      - LocalImport
      - MultiClause
      - MultiFileDef
      - MultiFileUse
      - NestedCalls
      - Operator
      - Overloaded
      - Parenthesis
      - Partial
      - PatternBind
      - Pointfree
      - QualifiedBodyDef
      - QualifiedBodyUse
      - QualifiedScopeUse
      - Recursive
      - Section
      - SectionApp
      - Shadow
      - TopLevel
      - Uncalled
      - UseSiteArg
      - Where
      - Where2
