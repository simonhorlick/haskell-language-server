# required for HLS to be able to typecheck and inspect the AST of the testdata
# files.
cradle:
  direct:
    arguments:
      - ArgParens
      - Capture
      - Constant
      - DoBlock
      - Guards
      - Imported
      - Infix
      - Let
      - LocalImport
      - MultiClause
      - Parenthesis
      - PatternBind
      - Pointfree
      - Recursive
      - Shadow
      - TopLevel
