# required for HLS to be able to typecheck and inspect the AST of the testdata
# files.
cradle:
  direct:
    arguments:
      - ArgParens
      - BodyParens
      - Capture
      - Class
      - Constant
      - DoBlock
      - DuplicateArg
      - Guards
      - Imported
      - Infix
      - Let
      - Let2
      - LocalImport
      - MultiClause
      - Operator
      - Parenthesis
      - PatternBind
      - Pointfree
      - Recursive
      - Shadow
      - TopLevel
      - Uncalled
      - Where
